name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core:
        description: A tag or branch of StirPHP/core to build with, over the one in CORE_VERSION
        required: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The release of StirPHP/core the site describes: `stirphp` checks the examples, and its
      # browser build runs the editor. CORE_VERSION names it, such as `v0.2.0`.
      - name: Which StirPHP
        id: core
        run: |
          ref="${{ inputs.core }}"
          if [ -z "$ref" ]; then ref=$(grep -v '^#' CORE_VERSION | head -n1 | tr -d '[:space:]'); fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "StirPHP/core at $ref"
      - uses: actions/checkout@v5
        with:
          repository: StirPHP/core
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - name: Fetch the PHP stubs
        working-directory: core
        run: git submodule update --init --depth 1 crates/stir_stubs/phpstorm-stubs
      - name: Rust toolchain
        working-directory: core
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0
      - name: Build stirphp
        working-directory: core
        run: cargo build --release --locked -p stir_cli

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The reference matches the source
        run: STIRPHP_CORE=core npm run gen:reference -- --check
      - name: The examples print what the pages show
        run: STIRPHP=core/target/release/stirphp npm run examples
      - name: Build the browser's language server
        run: STIRPHP_CORE=core npm run web
      - name: Build the site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
