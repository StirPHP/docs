<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- three translucent blades turning around a bright core: "stirring" -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff78a8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ce0049" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ce0049" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5a2a45" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9b1544" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9cbf" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2f73" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ce0049" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(200 200)">
    <path d="M0 -10 L150 -150 L120 40 Z" fill="url(#a)"/>
    <path d="M0 -10 L150 -150 L120 40 Z" fill="url(#b)" transform="rotate(120)"/>
    <path d="M0 -10 L150 -150 L120 40 Z" fill="url(#c)" transform="rotate(240)"/>
    <path d="M0 -10 L150 -150 L120 40 Z" fill="none" stroke="#ff78a8" stroke-opacity="0.35" transform="rotate(60) scale(0.72)"/>
    <path d="M0 -10 L150 -150 L120 40 Z" fill="none" stroke="#ff78a8" stroke-opacity="0.25" transform="rotate(180) scale(0.72)"/>
    <path d="M0 -10 L150 -150 L120 40 Z" fill="none" stroke="#ff78a8" stroke-opacity="0.2" transform="rotate(300) scale(0.72)"/>
    <circle r="70" fill="url(#core)"/>
  </g>
</svg>
